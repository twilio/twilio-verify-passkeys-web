name: CI

on:
  pull_request:
  push:
    branches: [main, develop, ci-update-develop] # TEMP: ci-update-develop for testing, remove before merge
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: 0

jobs:
  test:
    runs-on: ubuntu-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-app
          path: |
            sample-app/
            dist/

  # Hosts the demo on a Twilio Serverless service in the team account. Neither the demo
  # URL (copy it from the Twilio console) nor the backend URL appears in GitHub: set
  # SAMPLE_BACKEND_URL as an environment variable of the service; deploys keep it.
  # config.js is served by a function that reads it.
  deploy-demo:
    needs: build
    if: github.event_name == 'push' && contains(fromJSON('["refs/heads/develop", "refs/heads/ci-update-develop"]'), github.ref) # TEMP: ci-update-develop for testing
    runs-on: ubuntu-x64
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-app
          path: demo-app
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22 # twilio-run requires Node ^20 || ^22
      - name: Stage assets and config function
        run: |
          mkdir -p stage/assets stage/functions/sample-app
          cp -r demo-app/sample-app demo-app/dist stage/assets/
          # config.js is served by a function instead, so the backend URL lives only in the Twilio service
          rm stage/assets/sample-app/config.js
          echo '{"name":"e2e-passkeys-web-demo","private":true}' > stage/package.json
          cat > stage/functions/sample-app/config.js.js <<'EOF'
          exports.handler = (context, event, callback) => {
            const response = new Twilio.Response();
            response.appendHeader('Content-Type', 'application/javascript');
            response.setBody(`const API_URL = ${JSON.stringify(context.SAMPLE_BACKEND_URL || '')}`);
            callback(null, response);
          };
          EOF
      - name: Deploy to Twilio Serverless
        working-directory: stage
        env:
          TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
          TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}
        shell: bash
        # Same service + environment every run: a new Build replaces the active one, the URL stays.
        # The repo is public, so the *.twil.io domain and Twilio SIDs must not appear in logs or summaries.
        run: |
          status=0
          npx --yes twilio-run@5.0.1 deploy \
            --service-name e2e-passkeys-web-demo --environment dev --override-existing-project \
            --username "$TWILIO_API_KEY" --password "$TWILIO_API_SECRET" > deploy.log 2>&1 || status=$?
          # Redact the domain, Twilio SIDs and console links (identifiers of the team account)
          sed -E \
            -e 's/[a-z0-9-]+\.twil\.io/<redacted>.twil.io/g' \
            -e 's/(AC|SK|VA|ZS|ZE|ZB|ZN|ZF|ZA|ZV)[0-9a-f]{32}/\1<redacted>/g' \
            -e 's|https://console\.twilio\.com[^ ]*|<redacted console url>|g' \
            deploy.log
          exit $status

  # Manual gate standing in for the e2e repo's response: the `production` environment's
  # reviewers (another team member, develop/main only) approve once the e2e passed.
  e2e-manual-verification:
    needs: deploy-demo
    if: github.ref == 'refs/heads/develop' # production only accepts protected branches
    runs-on: ubuntu-x64
    environment: production
    steps:
      - run: echo "E2E tests manually approved"
